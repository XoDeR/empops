openapi: 3.0.3
info:
  title: EmpOps API
  version: 0.0.0
  description: Step 0 OpenAPI skeleton shared by Laravel and Go backends.
servers:
  - url: http://localhost:8000/api/v1
    description: Laravel (Step 0)
  - url: http://localhost:8080/api/v1
    description: Go (Step 0)
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
  /version:
    get:
      summary: Service version
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
  /auth/login:
    post:
      summary: Login (stub)
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
  /auth/refresh:
    post:
      summary: Refresh access token (stub)
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
  /auth/logout:
    post:
      summary: Logout (stub)
      operationId: authLogout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
  /auth/me:
    get:
      summary: Current user (stub)
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiEnvelope:
      type: object
      required: [success, message, data, error, timestamp]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        error:
          nullable: true
        timestamp:
          type: string
          format: date-time
