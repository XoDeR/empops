openapi: 3.0.3
info:
  title: EmpOps API
  version: 1.0.0
  description: EmpOps API (Laravel and Go parity). Step 6 adds projects, boards, tasks, and timesheet task linkage.
servers:
  - url: http://localhost:8000/api/v1
    description: Laravel
  - url: http://localhost:8080/api/v1
    description: Go
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
  /version:
    get:
      summary: Service version
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /auth/register:
    post:
      summary: Register a new user
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenPayload"
        "422":
          description: Validation error (e.g. email taken)

  /auth/login:
    post:
      summary: Login
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenPayload"
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh access token (rotate refresh)
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenPayload"
        "401":
          description: Invalid or revoked refresh token

  /auth/logout:
    post:
      summary: Logout (revoke refresh token)
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /auth/me:
    get:
      summary: Current user
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"

  /companies:
    get:
      summary: List companies for current user
      operationId: listCompanies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CompanyMembership"
    post:
      summary: Create a company
      operationId: createCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateCompanyResponse"

  /companies/join:
    post:
      summary: Join a company by code
      operationId: joinCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCompanyRequest"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateCompanyResponse"

  /invitations/{link}/accept:
    post:
      summary: Accept employee invitation
      operationId: acceptInvitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationLink"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateCompanyResponse"

  /companies/{companyId}:
    get:
      summary: Company details for member
      operationId: getCompany
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CompanyMembership"
    patch:
      summary: Update company settings (Adminland)
      operationId: updateCompany
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Company"
        "403":
          description: Forbidden

  /companies/{companyId}/employees:
    get:
      summary: List employees
      operationId: listEmployees
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Employee list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Employee"
    post:
      summary: Create employee
      operationId: createEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Employee"

  /companies/{companyId}/employees/{employeeId}:
    get:
      summary: Get employee
      operationId: getEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Employee"
    patch:
      summary: Update employee
      operationId: updateEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete employee
      operationId: deleteEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Deleted

  /companies/{companyId}/employees/{employeeId}/invite:
    post:
      summary: Create invitation for employee
      operationId: inviteEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Invitation created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Employee"

  /companies/{companyId}/positions:
    get:
      summary: List positions
      operationId: listPositions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Position"
    post:
      summary: Create position
      operationId: createPosition
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "201":
          description: Created

  /companies/{companyId}/positions/{positionId}:
    patch:
      summary: Update position
      operationId: updatePosition
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/PositionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete position
      operationId: deletePosition
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: Deleted

  /companies/{companyId}/employee-statuses:
    get:
      summary: List employee statuses
      operationId: listEmployeeStatuses
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Statuses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EmployeeStatus"
    post:
      summary: Create employee status
      operationId: createEmployeeStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeStatusInput"
      responses:
        "201":
          description: Created

  /companies/{companyId}/employee-statuses/{statusId}:
    patch:
      summary: Update employee status
      operationId: updateEmployeeStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/StatusId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeStatusInput"
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete employee status
      operationId: deleteEmployeeStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/StatusId"
      responses:
        "200":
          description: Deleted

  /companies/{companyId}/teams:
    get:
      summary: List teams
      operationId: listTeams
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Team"
    post:
      summary: Create team
      operationId: createTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Team"

  /companies/{companyId}/teams/{teamId}:
    get:
      summary: Get team
      operationId: getTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Team"
    patch:
      summary: Update team
      operationId: updateTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete team
      operationId: deleteTeam
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Deleted

  /companies/{companyId}/teams/{teamId}/members/{employeeId}:
    post:
      summary: Add team member
      operationId: addTeamMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Member added
    delete:
      summary: Remove team member
      operationId: removeTeamMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Member removed

  /companies/{companyId}/teams/{teamId}/lead:
    put:
      summary: Set or clear team lead
      operationId: setTeamLead
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTeamLeadRequest"
      responses:
        "200":
          description: Lead updated

  /companies/{companyId}/employees/{employeeId}/managers:
    get:
      summary: List managers for employee
      operationId: listManagers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Managers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EmployeeSummary"
    post:
      summary: Assign manager
      operationId: assignManager
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignManagerRequest"
      responses:
        "201":
          description: Manager assigned

  /companies/{companyId}/employees/{employeeId}/managers/{managerId}:
    delete:
      summary: Unassign manager
      operationId: unassignManager
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
        - $ref: "#/components/parameters/ManagerId"
      responses:
        "200":
          description: Manager unassigned

  /companies/{companyId}/employees/{employeeId}/direct-reports:
    get:
      summary: List direct reports
      operationId: listDirectReports
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Direct reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EmployeeSummary"

  /companies/{companyId}/dashboard/me:
    get:
      summary: Me dashboard shell
      operationId: dashboardMe
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Dashboard shell
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardShell"

  /companies/{companyId}/dashboard/accountant:
    get:
      summary: Accountant dashboard shell
      operationId: dashboardAccountant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Dashboard shell with pending accounting expenses
        "403":
          description: Not an accountant

  /companies/{companyId}/timesheets:
    get:
      summary: Create-or-get timesheet for a week (query date)
      operationId: getOrCreateTimesheet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Any date in the target Mon–Sun week (defaults to today)
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
          description: Target employee (defaults to self; requires timesheets.view if not self)
      responses:
        "200":
          description: Timesheet with entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Timesheet"
    post:
      summary: Create-or-get timesheet for a week
      operationId: createOrGetTimesheet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                employee_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Timesheet with entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Timesheet"

  /companies/{companyId}/timesheets/pending:
    get:
      summary: Pending timesheets for manager or HR approval
      operationId: listPendingTimesheets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: List of ready_to_submit timesheets

  /companies/{companyId}/timesheets/{timesheetId}:
    get:
      summary: Get timesheet
      operationId: getTimesheet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TimesheetId"
      responses:
        "200":
          description: Timesheet with entries

  /companies/{companyId}/timesheets/{timesheetId}/entries:
    post:
      summary: Upsert a time tracking entry (ad-hoc)
      operationId: upsertTimesheetEntry
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TimesheetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetEntryInput"
      responses:
        "200":
          description: Updated timesheet
        "422":
          description: Validation or duration cap exceeded

  /companies/{companyId}/timesheets/{timesheetId}/entries/{entryId}:
    delete:
      summary: Delete a time tracking entry
      operationId: deleteTimesheetEntry
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TimesheetId"
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Updated timesheet

  /companies/{companyId}/timesheets/{timesheetId}/submit:
    post:
      summary: Submit timesheet for approval
      operationId: submitTimesheet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TimesheetId"
      responses:
        "200":
          description: Timesheet now ready_to_submit

  /companies/{companyId}/timesheets/{timesheetId}/approve:
    post:
      summary: Approve timesheet
      operationId: approveTimesheet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TimesheetId"
      responses:
        "200":
          description: Timesheet approved

  /companies/{companyId}/timesheets/{timesheetId}/reject:
    post:
      summary: Reject timesheet
      operationId: rejectTimesheet
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/TimesheetId"
      responses:
        "200":
          description: Timesheet rejected

  /companies/{companyId}/timesheets/projects:
    get:
      summary: Projects available for timesheet time logging
      operationId: listTimesheetProjects
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Project summaries for the current employee

  /companies/{companyId}/timesheets/projects/{projectId}/tasks:
    get:
      summary: Project tasks available for timesheet time logging
      operationId: listTimesheetProjectTasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Task summaries

  /companies/{companyId}/issue-types:
    get:
      summary: List company issue types
      operationId: listIssueTypes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Issue types

  /companies/{companyId}/projects:
    get:
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Projects visible to the actor
    post:
      summary: Create project
      operationId: createProject
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created

  /companies/{companyId}/projects/{projectId}:
    get:
      summary: Get project
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
