  /jobs/{companySlug}/jobs/{jobSlug}/apply/{candidateUuid}/complete:
    post:
      summary: Finalize public application
      operationId: completePublicApplication
      parameters:
        - $ref: "#/components/parameters/CompanySlug"
        - $ref: "#/components/parameters/JobSlug"
        - $ref: "#/components/parameters/CandidateUuid"
      responses:
        "200":
          description: Application completed

  /jobs/{companySlug}/jobs/{jobSlug}/apply/{candidateUuid}:
    delete:
      summary: Abandon incomplete application
      operationId: abandonPublicApplication
      parameters:
        - $ref: "#/components/parameters/CompanySlug"
        - $ref: "#/components/parameters/JobSlug"
        - $ref: "#/components/parameters/CandidateUuid"
      responses:
        "200":
          description: Abandoned

