env: dev

http:
  port: 8080

jwt:
  secret: "dev-secret-change-me"
  issuer: empops
  audience: empops-web
  access_token_ttl: 15m
  refresh_token_ttl: 168h # 7 days

cors:
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000

log:
  level: debug

db:
  # Optional in Step 0 - the stub auth flow works without Postgres.
  dsn: "postgres://empops:empops@localhost:5433/empops_go?sslmode=disable"
